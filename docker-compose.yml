services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sementica-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: sementica-falkordb
    ports:
      - "6379:6379"   # Redis 호환 포트
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: sementica-falkordb-browser
    ports:
      - "3000:3000"   # 웹 UI
    environment:
      - FALKORDB_URL=falkor://falkordb:6379
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  qdrant_data:
  falkordb_data:
