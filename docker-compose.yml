services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sementica-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    container_name: sementica-falkordb
    ports:
      - "6379:6379"   # Redis 호환 포트
    volumes:
      - falkordb_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 3600 1
      --save 300 100
    restart: unless-stopped

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: sementica-falkordb-browser
    ports:
      - "3000:3000"   # 웹 UI
    environment:
      - FALKORDB_URL=falkor://falkordb:6379
    depends_on:
      - falkordb
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sementica-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       semantica
      POSTGRES_USER:     semantica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/ops_log.sql:/docker-entrypoint-initdb.d/01_ops_log.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantica -d semantica"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  falkordb_data:
  postgres_data:
