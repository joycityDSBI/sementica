# nginx — Semantica REST API HTTPS 종료
# 배포 위치: /etc/nginx/conf.d/sementica.conf
#
#   sudo bash deploy/install.sh --domain ontology.joycityplay.com nginx
#   sudo bash deploy/install.sh --domain ontology.joycityplay.com --with-tls nginx
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 필요한가
#   Snowflake UDF 는 공개 인터넷에서 이 API 를 호출합니다. ngrok 으로 우회하던
#   것을 2026-09-15 에 걷어냈고(재시작마다 URL 이 바뀌어 UDF 를 매번 다시
#   만들어야 했습니다), 고정 도메인 + nginx 로 대체합니다.
#
# 인증서
#   와일드카드(`*.joycityplay.com`, GlobalSign)를 씁니다. ACME/certbot 이
#   필요 없는 대신 **자동 갱신도 없습니다** — 만료일을 사람이 챙겨야 합니다.
#
#   nginx 의 ssl_certificate 는 **리프 + 중간 CA 를 이어붙인 파일**이어야
#   합니다. 리프만 주면 브라우저는 캐시 덕에 통과해도 Snowflake 같은 클라이언트는
#   체인을 못 세워 실패합니다 — "브라우저에서는 되는데 UDF 만 안 되는" 형태라
#   원인을 찾기 어렵습니다.
#
# 중요: REST 는 127.0.0.1 에만 바인딩합니다.
#   nginx 를 세워두고 8766 을 외부에 그대로 열어두면 **평문 HTTP 우회로가
#   남습니다.** 방화벽에서 8766 인바운드를 닫으세요.
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS 리다이렉트.
server {
    listen      80;
    listen      [::]:80;
    server_name <SEMANTICA_HOST>;

    # ACME(Let's Encrypt) 용. 와일드카드 인증서를 쓰는 동안은 안 쓰이지만,
    # 나중에 certbot 으로 갈아탈 때를 위해 남겨둡니다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

