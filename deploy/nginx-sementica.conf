# nginx — Semantica REST API HTTPS 종료
# 배포 위치: /etc/nginx/conf.d/sementica.conf
#
# ⚠️ **인증서가 없으면 nginx 가 기동에 실패합니다.** 아래 ssl_certificate 가
#    없는 파일을 가리키면 `nginx -t` 부터 떨어집니다. 순서를 지키세요:
#
#   ① 도메인 발급 + DNS A 레코드를 이 서버(공인 IP)로
#   ② 방화벽 80 개방 (HTTP-01 검증용. DNS-01 을 쓴다면 생략 가능)
#   ③ 이 파일 설치 — 이때는 **443 블록이 주석 상태**입니다
#         sudo bash deploy/install.sh --domain <도메인> nginx
#         sudo nginx -t && sudo systemctl reload nginx
#   ④ 인증서 발급
#         sudo certbot certonly --webroot -w /var/www/html -d <도메인>
#   ⑤ 아래 "── 여기부터 ⑤ 단계" 이후의 주석을 풀고 reload
#         sudo nginx -t && sudo systemctl reload nginx
#   ⑥ 방화벽 443 개방, 8766 인바운드 차단
#
#   사내 CA 로 받았다면 ④ 대신 발급받은 파일 경로를 ssl_certificate 에
#   적으면 됩니다. 다만 **Snowflake 는 표준 TLS 검증을 하므로 사내 CA 는
#   신뢰하지 않습니다** — 공인 CA 인증서여야 UDF 가 붙습니다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 필요한가
#   Snowflake UDF 는 공개 인터넷에서 이 API 를 호출합니다. ngrok 으로 우회하던
#   것을 2026-09-15 에 걷어냈고(재시작마다 URL 이 바뀌어 UDF 를 매번 다시
#   만들어야 했습니다), 고정 도메인 + nginx 로 대체합니다.
#
# 중요: REST 는 이제 127.0.0.1 에만 바인딩합니다.
#   nginx 를 세워두고 8766 을 외부에 그대로 열어두면 **평문 HTTP 우회로가
#   남습니다.** 토큰이 평문으로 지나갈 수 있으므로 방화벽에서 8766 인바운드를
#   닫고, 유닛의 --host 도 127.0.0.1 로 바꿔야 합니다 (deploy/install.sh 가
#   설치하는 sementica-rest.service 에 이미 반영돼 있습니다).
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS. ACME(Let's Encrypt) 챌린지만 평문으로 통과시킵니다.
server {
    listen      80;
    listen      [::]:80;
    server_name <SEMANTICA_HOST>;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# ── 여기부터 ⑤ 단계 — 인증서를 받은 뒤 아래 블록의 주석을 푸세요
# ─────────────────────────────────────────────────────────────────────────────
# 인증서 파일이 없는 상태로 이 블록을 켜면 nginx 가 기동하지 않습니다.
# 확인:  sudo ls -l /etc/letsencrypt/live/<도메인>/fullchain.pem
#
#server {
#    listen      443 ssl;
#    listen      [::]:443 ssl;
#    http2       on;
#    server_name <SEMANTICA_HOST>;
#
#    # 사내 CA 로 발급받았다면 아래 두 경로를 그 파일로 바꾸세요.
#    # certbot 을 쓴다면 `certbot --nginx -d <도메인>` 이 알아서 채웁니다.
#    ssl_certificate     /etc/letsencrypt/live/<SEMANTICA_HOST>/fullchain.pem;
#    ssl_certificate_key /etc/letsencrypt/live/<SEMANTICA_HOST>/privkey.pem;
#
#    ssl_protocols       TLSv1.2 TLSv1.3;
#    ssl_ciphers         HIGH:!aNULL:!MD5;
#    ssl_session_cache   shared:SSL:10m;
#    ssl_session_timeout 10m;
#
#    # 액세스 로그는 별도 파일로 — 어떤 UDF 호출이 언제 왔는지 추적할 수
#    # 있어야 합니다. logrotate 는 /etc/logrotate.d/nginx 가 이미 관리합니다.
#    access_log /var/log/nginx/sementica.access.log;
#    error_log  /var/log/nginx/sementica.error.log;
#
#    # 응답 본문이 큽니다 — hybrid 는 60,000자 예산까지 돌려줍니다.
#    # 기본 proxy_buffer 로는 디스크 임시파일을 타서 느려집니다.
#    proxy_buffering      on;
#    proxy_buffers        16 32k;
#    proxy_buffer_size    32k;
#
#    # 요청 본문은 작습니다. 크게 열어둘 이유가 없습니다.
#    client_max_body_size 256k;
#
#    # REST API 는 검색·LLM 을 태우므로 30초를 넘길 수 있습니다.
#    # UDF 쪽 timeout 이 30초이므로 그보다 넉넉히 잡되, 무한정은 아닙니다.
#    proxy_connect_timeout 10s;
#    proxy_send_timeout    60s;
#    proxy_read_timeout    60s;
#
