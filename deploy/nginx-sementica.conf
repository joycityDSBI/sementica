#        # 로 다른 헤더를 건드릴 때 실수로 지우지 마세요 — 지우면 REST 가
#        # 토큰을 못 보고 **모든 UDF 가 401** 이 됩니다.
#    }
#
#    # 헬스체크만 사내망에서 인증 없이 열어둘 수도 있습니다. 기본은 동일 처리라
